[project]
name = "susume-knowledge-api"
version = "0.1.0"
description = "Grounded hybrid search API for the Susume Nihongo book"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "fastembed>=0.7.4,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "qdrant-client>=1.15,<2",
  "tokenizers>=0.21,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
]

[project.scripts]
susume = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

